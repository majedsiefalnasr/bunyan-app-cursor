name: Architecture Governance

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  governance:
    name: Architecture Governance
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Validate layer boundaries
        run: |
          echo "Checking controller layer boundaries..."
          # Controllers should not contain Eloquent queries directly
          VIOLATIONS=$(rg -n --glob="*.php" "DB::|::query\\(\\)|->where\\(" app/Http/Controllers/ 2>/dev/null | rg -v "// @allow-query" || true)
          if [[ -n "$VIOLATIONS" ]]; then
            echo "⚠ Warning: Direct DB queries found in controllers:"
            echo "$VIOLATIONS"
            echo ""
            echo "Move queries to Repository classes."
          else
            echo "✓ Controller layer clean"
          fi

      - name: Validate RBAC middleware
        run: |
          echo "Checking route RBAC middleware..."
          # Check that API routes have auth/RBAC middleware
          UNPROTECTED=$(rg -n "Route::" routes/api.php 2>/dev/null | rg -v "middleware|auth|// public" || true)
          if [[ -n "$UNPROTECTED" ]]; then
            echo "⚠ Warning: Potentially unprotected API routes:"
            echo "$UNPROTECTED"
          else
            echo "✓ All API routes appear protected"
          fi

      - name: Check migration safety
        run: |
          echo "Checking migration safety..."
          # Check for destructive operations in migrations
          DESTRUCTIVE=$(rg -n --glob="*.php" "dropColumn|dropTable|drop\\(" database/migrations/ 2>/dev/null || true)
          if [[ -n "$DESTRUCTIVE" ]]; then
            echo "⚠ Warning: Destructive operations in migrations:"
            echo "$DESTRUCTIVE"
            echo "Ensure these are intentional and have a rollback plan."
          else
            echo "✓ No destructive migration operations"
          fi
