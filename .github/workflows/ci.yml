name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Laravel)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: bunyan_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo, pdo_mysql, redis, mbstring, xml, bcmath, gd
          coverage: xdebug

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Copy environment file
        run: cp ci.env .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Run migrations
        run: php artisan migrate --force
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: bunyan_test
          DB_USERNAME: root
          DB_PASSWORD: password

      - name: Laravel Pint (Lint)
        run: vendor/bin/pint --test

      - name: PHPStan (Static Analysis)
        run: vendor/bin/phpstan analyse --memory-limit=512M

      - name: PHPUnit (Tests)
        run: php artisan test --parallel
        # Do not set DB_* here: PHPUnit uses sqlite :memory: (phpunit.xml).

  frontend:
    name: Frontend (Nuxt.js)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: ESLint
        run: npm run lint
        working-directory: frontend

      - name: TypeScript Check
        run: npx nuxi typecheck
        working-directory: frontend

      - name: Vitest (Unit + Component Tests)
        run: npm run test
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend, frontend]
    defaults:
      run:
        working-directory: backend

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: bunyan_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo, pdo_mysql, redis, mbstring, xml, bcmath, gd

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-e2e-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-e2e-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Setup backend environment
        run: |
          cp ci.env .env
          php artisan key:generate
          php artisan migrate --force
          php artisan db:seed --force
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: bunyan_test
          DB_USERNAME: root
          DB_PASSWORD: password

      - name: Start Laravel API server
        run: php artisan serve --host=127.0.0.1 --port=8000 &
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: bunyan_test
          DB_USERNAME: root
          DB_PASSWORD: password

      - name: Wait for Laravel API
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:8000/__ci_ready" >/dev/null; then
              echo "Laravel is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Timed out waiting for Laravel on http://127.0.0.1:8000/__ci_ready"
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Run Playwright E2E tests
        run: npm run test:e2e
        working-directory: frontend
        env:
          NUXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000/api
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
