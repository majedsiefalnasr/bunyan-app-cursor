name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      e2e: ${{ steps.filter.outputs.e2e }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Paths filter
        id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            e2e:
              - 'frontend/tests/e2e/**'
              - 'backend/routes/**'
              - 'backend/app/**'
              - 'backend/database/**'
            ci:
              - '.github/workflows/**'

  backend:
    name: Backend
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci == 'true' }}
    uses: ./.github/workflows/backend-ci.yml
    with:
      php_version: "8.2"
      upload_coverage: false

  frontend:
    name: Frontend
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true' }}
    uses: ./.github/workflows/frontend-ci.yml
    with:
      node_version: "20"
      upload_coverage: false

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: changes
    if: ${{ needs.changes.outputs.e2e == 'true' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' }}
    defaults:
      run:
        working-directory: backend

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: bunyan_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Setup PHP
        uses: shivammathur/setup-php@728c6c6b8cf02c2e48117716a91ee48313958a19
        with:
          php-version: "8.2"
          extensions: pdo, pdo_mysql, redis, mbstring, xml, bcmath, gd

      - name: Cache Composer dependencies
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: backend/vendor
          key: composer-e2e-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-e2e-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Setup backend environment
        run: |
          cp ci.env .env
          php artisan key:generate
          php artisan migrate --force
          php artisan db:seed --force
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: bunyan_test
          DB_USERNAME: root
          DB_PASSWORD: password

      - name: Start Laravel API server
        run: php artisan serve --host=127.0.0.1 --port=8000 &
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: bunyan_test
          DB_USERNAME: root
          DB_PASSWORD: password

      - name: Wait for Laravel API
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:8000/__ci_ready" >/dev/null; then
              echo "Laravel is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Timed out waiting for Laravel on http://127.0.0.1:8000/__ci_ready"
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}-chromium
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Run Playwright E2E tests
        run: npm run test:e2e
        working-directory: frontend
        env:
          NUXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000/api
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
