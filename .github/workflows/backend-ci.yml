name: Backend CI

on:
  workflow_call:
    inputs:
      php_version:
        type: string
        default: "8.2"
      upload_coverage:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Laravel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Setup PHP
        uses: shivammathur/setup-php@728c6c6b8cf02c2e48117716a91ee48313958a19
        with:
          php-version: ${{ inputs.php_version }}
          extensions: pdo, pdo_mysql, redis, mbstring, xml, bcmath, gd
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Laravel Pint (Lint)
        run: vendor/bin/pint --test

      - name: PHPStan (Static Analysis)
        run: vendor/bin/phpstan analyse --memory-limit=512M --no-progress

      - name: PHPUnit (Tests)
        run: php artisan test --parallel

      - name: Upload Coverage
        if: ${{ inputs.upload_coverage }}
        uses: codecov/codecov-action@ab904c41d6ece82784817410c45d8b8c02684457
        with:
          files: ./backend/build/coverage.xml
