name: Pre-Commit Guard

on:
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  guard:
    runs-on: ubuntu-latest
    name: PR Guardrails (fast)
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          fetch-depth: 0

      - name: Block WIP PRs
        run: |
          title='${{ github.event.pull_request.title }}'
          if echo "$title" | grep -Eiq '(^\\s*wip\\b|\\bwip\\b)'; then
            echo "✗ PR title contains WIP; mark it ready before merging."
            exit 1
          fi
          echo "✓ PR title looks merge-ready"

      - name: Validate branch naming (soft)
        run: |
          BRANCH="${GITHUB_HEAD_REF}"
          echo "Branch: ${BRANCH}"
          if [[ "$BRANCH" =~ ^(feature|fix|chore|spec)/.+$ ]]; then
            echo "✓ Branch naming looks good"
          else
            echo "⚠ Warning: unexpected branch prefix (expected feature/*, fix/*, chore/*, spec/*)"
          fi

      - name: Ensure no secrets committed (quick scan)
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -Eiq '(^|/)(\\.env|\\.env\\..+|credentials\\.json|id_rsa|\\.pem)$'; then
            echo "✗ Potential secret file detected in PR changes."
            exit 1
          fi
          echo "✓ No obvious secret files detected"
